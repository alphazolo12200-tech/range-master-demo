<script>
const MOA=2.909e-4,cv=document.getElementById('c'),ctx=cv.getContext('2d'),act=document.getElementById('act'),gs=document.getElementById('gs'),ds=document.getElementById('ds'),ss=document.getElementById('ss'),os=document.getElementById('os');

{n:'9mm Carbine (PCC)',ex:'CZ Scorpion carbine class',t:'Rimfire & carbines',mv:390,bc:.15,m:.008,d:.009,moa:3,mag:30,zero:50,cool:.14,bolt:0,rec:2,pb:.06,sh:.04,ranges:[10,25,50,100],o:CB,od:1},
{n:'5.56 Carbine',ex:'AR-15 / M4 class',t:'Rifles',mv:900,bc:.30,m:.004,d:.00562,moa:2.5,mag:30,zero:100,cool:.18,bolt:0,rec:2.5,pb:.06,sh:.05,ranges:[25,50,100,200,300,400],o:RF,od:3},

{n:'7.62 Battle Rifle',ex:'M14 / FAL class',t:'Rifles',mv:840,bc:.40,m:.0097,d:.00782,moa:2,mag:20,zero:100,cool:.22,bolt:0,rec:4,pb:.06,sh:.05,ranges:[100,200,300,400,600],o:RF,od:3},

{n:'.308 Precision Rifle',ex:'Remington 700 / M24 class',t:'Precision rifles',mv:810,bc:.50,m:.0113,d:.00782,moa:.6,mag:5,zero:100,cool:1.3,bolt:1,rec:2.5,pb:.05,sh:.05,ranges:[100,200,300,500,600,800],o:PR,od:4},
{n:'6.5 Creedmoor Rifle',ex:'Ruger Precision class',t:'Precision rifles',mv:826,bc:.62,m:.00907,d:.00676,moa:.5,mag:5,zero:100,cool:1.3,bolt:1,rec:2.5,pb:.05,sh:.05,ranges:[300,500,800,1000,1200],o:PR,od:4},
{n:'.300 Win Mag Rifle',ex:'Remington 700 class',t:'Precision rifles',mv:880,bc:.55,m:.0123,d:.00782,moa:.6,mag:5,zero:100,cool:1.4,bolt:1,rec:5,pb:.06,sh:.05,ranges:[300,600,800,1000,1200],o:PR,od:5},

const DG=[0,5,9],DO=[0,4],DR=[25,100,300],dod=()=>DO.includes(g.od)?g.od:g.o.find(k=>DO.includes(k));

const CD=[[0,.263],[.5,.256],[.7,.25],[.8,.262],[.9,.318],[.95,.38],[1,.443],[1.05,.48],[1.1,.495],[1.2,.504],[1.4,.494],[1.6,.47],[2,.428],[2.5,.385],[3,.35],[4,.31]];

else{M={x:0,y:0,w:W,h:H*.52};const s=Math.min(H*.48-16,W*.5);I={x:8,y:H*.52+8,w:s,h:s};S={x:s+16,y:H*.52+8,w:W-s-24,h:H*.48-16}}

addEventListener('resize',rs);

function aeApply(){if(autoE)elev=Math.round(need().e*4)/4}
function setGun(i){gi=i;g=GUNS[i];ds.innerHTML=g.ranges.map(r=>'<option'+(DR.includes(r)?'':' disabled')+'>'+(DR.includes(r)?'':'\u{1F512} ')+r+' m</option>').join('');di=g.ranges.indexOf(g.ranges.includes(100)&&DR.includes(100)?100:g.ranges.find(r=>DR.includes(r)));ds.selectedIndex=di;X=g.ranges[di];os.innerHTML=g.o.map(k=>'<option value="'+k+'"'+(DO.includes(k)?'':' disabled')+'>'+(DO.includes(k)?'':'\u{1F512} ')+OPTS[k].n+'</option>').join('');os.value=dod();sti=g.t==='Handguns'?0:3;ss.selectedIndex=sti;setSight(dod());newT()}
function setSight(k){oi=k;O=OPTS[k];zi=O.z.length>1?Math.floor((O.z.length-1)/2):0;zero(g);elev=0;wdial=0;aeApply()}
function newT(){shots=[];done=false;document.getElementById('fin').textContent='Finish';ammo=g.mag;cdT=0;rlT=0;wind=rnd(-8,8);wph=rnd(0,6.3);bx.x=bx.y=rc.x=rc.y=0}
let og,lt='';GUNS.forEach((q,i)=>{if(q.t!==lt){og=document.createElement('optgroup');og.label=lt=q.t;gs.appendChild(og)}{const o=new Option((DG.includes(i)?'':'\u{1F512} ')+q.n,i);o.disabled=!DG.includes(i);og.appendChild(o)}});STN.forEach((q,i)=>ss.add(new Option(q[0],i)));gs.value=gi;os.onchange=()=>{setSight(+os.value);newT()};
gs.onchange=()=>setGun(+gs.value);ds.onchange=()=>{di=ds.selectedIndex;X=g.ranges[di];aeApply();newT()};ss.onchange=()=>sti=ss.selectedIndex;
let AC,NB;
function bang(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=g.bolt?1500:g.mv<500?2800:2200;v.gain.value=g.mv<500?.5:.8;s.connect(f);f.connect(v);v.connect(AC.destination);s.start();
const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(130,n);o.frequency.exponentialRampToValueAtTime(40,n+.15);og.gain.setValueAtTime(.5,n);og.gain.exponentialRampToValueAtTime(.001,n+.15);o.connect(og);og.connect(AC.destination);o.start();o.stop(n+.16)}catch(e){}}
function fire(){if(done)return;if(rlT>0||cdT>0)return;if(ammo<=0){msg='Magazine empty. Reload (R).';msgT=1.8;return}
const a=aim(),r=fly(g,g.th+elev*MOA,X),dr=windNow()*(r.t-X/g.mv),sg=Math.hypot(g.moa,(g.t==='Handguns'?12:25)*(1-ads))*MOA/3.5;
const x=X*Math.tan(a.x+gauss()*sg)+dr+wdial*MOA*X,y=X*Math.tan(a.y+gauss()*sg)+(r.y-SH());
const p=pw(),e=Math.max(0,Math.hypot(x,y)-g.d/2),k=Math.floor(e/p),f=e/p-k,s=k>9?0:Math.floor((10-k+.9*(1-f))*10)/10;
shots.push({x,y,s});ammo--;cdT=g.cool;flash=.08;rc.y+=g.rec*MOA*rnd(.8,1.2);rc.x+=g.rec*MOA*rnd(-.35,.35);bang();
if(shots.length>=300)finish()}
function finish(){if(!shots.length)return;done=true;const n=shots.length,av=shots.reduce((q,z)=>q+z.s,0)/n,key='ra'+gi+'_'+X;try{const b=+localStorage.getItem(key)||0;if(n>=5&&av>b)localStorage.setItem(key,av.toFixed(2))}catch(e){}}
function reload(){if(rlT>0||ammo>=g.mag||done)return;rlT=g.rl||(g.bolt?3:g.mag<=15?1.8:2.4);msg='Reloading...';msgT=rlT}
function dial(w,e){wdial+=w;elev+=e}
function zoom(d){zi=clamp(zi+d,0,O.z.length-1)}
function stats(){const n=shots.length;if(!n)return null;let tot=0,mx=0,my=0,mr=0,es=0;for(const s of shots){tot+=s.s;mx+=s.x;my+=s.y}mx/=n;my/=n;for(const s of shots){mr+=Math.hypot(s.x-mx,s.y-my);for(const t of shots)es=Math.max(es,Math.hypot(s.x-t.x,s.y-t.y))}return{tot,mx,my,mr:mr/n,es}}
document.getElementById('bar').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;
if(a==='zm')zoom(-1);else if(a==='zp')zoom(1);else if(a==='eu')dial(0,.25);else if(a==='ed')dial(0,-.25);else if(a==='eU')dial(0,2);else if(a==='eD')dial(0,-2);else if(a==='wl')dial(-.25,0);else if(a==='wr')dial(.25,0);

const hb=document.getElementById('hold');hb.onpointerdown=()=>holding=true;for(const ev of['pointerup','pointerleave','pointercancel'])hb.addEventListener(ev,()=>holding=false);

addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '||k==='enter'){e.preventDefault();fire()}else if(k==='shift')shiftDown=true;else if(k==='b')holding=true;else if(k==='r')reload();else if(k==='n')newT();else if(k==='w')dial(0,.25);else if(k==='s')dial(0,-.25);else if(k==='a')dial(-.25,0);else if(k==='d')dial(.25,0);else if(k==='z')zoom(-1);else if(k==='x')zoom(1);
else if(k.startsWith('arrow')){e.preventDefault();bx.x+=(k==='arrowright'?1:k==='arrowleft'?-1:0)*.4*MOA;bx.y+=(k==='arrowup'?1:k==='arrowdown'?-1:0)*.4*MOA}});
addEventListener('keyup',e=>{if(e.key==='Shift')shiftDown=false;if(e.key.toLowerCase()==='b')holding=false});addEventListener('blur',()=>{shiftDown=rmb=holding=false});
let drag=null,shiftDown=false,rmb=false,tgl=false,ads=0,autoE=true;
const LIM=.12;

else{const r=cv.getBoundingClientRect();if(e.clientX-r.left<M.w&&e.clientY-r.top<M.h){drag={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)}}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')look(e.movementX,e.movementY);else if(drag&&drag.id===e.pointerId){look(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY}});

function txt(t,x,y,c,al){ctx.fillStyle=c||'#f1f1e4';ctx.textAlign=al||'left';ctx.fillText(t,x,y)}
